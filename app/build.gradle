plugins {
    id 'com.android.application'
}

android {
    namespace 'com.unrevr.munhaeryeok'
    compileSdk 36

    buildFeatures {
        resValues = true
    }

    defaultConfig {
        applicationId "com.unrevr.auk"
        minSdk 28
        targetSdk 36
        versionCode 25
        versionName "1.0.0"
        resValue "string", "app_version", versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // Run device regressions on Robolectric as well as through AndroidJUnitRunner.
    sourceSets.test.java.srcDir 'src/androidTest/java'
    testOptions.unitTests.includeAndroidResources = true
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Use the same privacy notice in the APK and on the public policy page.
abstract class BundlePrivacyPolicy extends Sync {
    @Internal
    abstract DirectoryProperty getAssetDirectory()
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def policy = tasks.register("bundle${variant.name.capitalize()}PrivacyPolicy", BundlePrivacyPolicy) {
        from rootProject.file('privacy.html')
        into assetDirectory
    }
    variant.sources.assets.addGeneratedSourceDirectory(policy) { it.assetDirectory }
}

// Android 16's Robolectric runtime requires Java 21.
tasks.withType(Test).configureEach {
    // Cold-start migration fixtures must not share application singletons with UI tests.
    forkEvery = 1
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.12.4'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation "com.github.skydoves:expandablelayout:1.0.7"
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "org.jsoup:jsoup:1.14.3"
    implementation "io.reactivex.rxjava3:rxjava:3.1.2"
    implementation "io.reactivex.rxjava3:rxandroid:3.0.0"
}
